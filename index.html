<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Clock Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">WorkClock</h1>
                    <p class="text-xs text-slate-500">Simple Time & Hours Tracker</p>
                </div>
            </div>
            <div id="live-clock" class="text-sm font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                00:00:00
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-grow space-y-6">

        <!-- Notification Banner / Custom Alert Box -->
        <div id="notification" class="hidden p-4 rounded-xl text-sm font-medium transition-all shadow-sm flex items-center justify-between">
            <span id="notification-text"></span>
            <button onclick="hideNotification()" class="text-current opacity-70 hover:opacity-100 font-bold ml-2">&times;</button>
        </div>

        <!-- Main Action Card -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-indigo-500 to-violet-500"></div>
            
            <div class="mb-4">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Current Status</span>
                <div id="status-badge" class="mt-1 inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-amber-100 text-amber-800">
                    <span class="w-2 h-2 mr-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                    Checked Out
                </div>
            </div>

            <!-- Single Prominent Button -->
            <div class="my-6">
                <button id="action-btn" onclick="toggleClock()" class="w-full sm:w-80 py-5 px-8 rounded-2xl font-bold text-lg text-white shadow-lg transition-all transform active:scale-95 flex items-center justify-center space-x-3 bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200">
                    <svg id="btn-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                    </svg>
                    <span id="btn-text">Clock In</span>
                </button>
            </div>
            
            <p id="last-action-time" class="text-xs text-slate-400">No recent activity today</p>
        </div>

        <!-- Weekly Summary Section -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    <span>Weekly Summary</span>
                </h2>
                <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md font-medium">Calculated Automatically</span>
            </div>
            
            <div id="weekly-summary-container" class="space-y-3">
                <!-- Dynamically filled weekly cards -->
                <div class="text-center py-6 text-slate-400 text-sm">No hours recorded yet. Click Clock In to start!</div>
            </div>
        </div>

        <!-- History Log Section -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Activity Log</span>
                </h2>
                <div class="flex space-x-2">
                    <button onclick="exportData()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg transition-colors border border-slate-200 flex items-center space-x-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>Export CSV</span>
                    </button>
                    <button onclick="clearAllData()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-medium px-3 py-1.5 rounded-lg transition-colors border border-rose-200">
                        Clear All
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-100">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-3 px-4">Date</th>
                            <th class="py-3 px-4">Time</th>
                            <th class="py-3 px-4">Type</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Rows populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 bg-white mt-10">
        WorkClock App &bull; Local data storage enabled
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Storage Key for LocalStorage
        const STORAGE_KEY = 'work_clock_logs_v1';

        // Initialize state from localStorage
        let logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        // Live Clock in Header
        function updateLiveClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // Show custom notification box (Replaces alert)
        function showNotification(message, type = 'success') {
            const notif = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            text.innerText = message;
            
            if(type === 'success') {
                notif.className = 'p-4 rounded-xl text-sm font-medium transition-all shadow-sm flex items-center justify-between bg-emerald-50 border border-emerald-200 text-emerald-800';
            } else {
                notif.className = 'p-4 rounded-xl text-sm font-medium transition-all shadow-sm flex items-center justify-between bg-rose-50 border border-rose-200 text-rose-800';
            }
            
            notif.classList.remove('hidden');
            setTimeout(() => { hideNotification(); }, 4000);
        }

        function hideNotification() {
            document.getElementById('notification').classList.add('hidden');
        }

        // Determine current status based on the latest log entry
        // If last entry is "In", next action is "Out". Otherwise "In".
        function getCurrentStatus() {
            if (logs.length === 0) return 'Out';
            // Sort logs chronologically to be sure about the latest
            const sorted = [...logs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            return sorted[0].type === 'In' ? 'In' : 'Out';
        }

        // Toggle clock in / clock out button action
        function toggleClock() {
            const currentStatus = getCurrentStatus();
            const nextType = currentStatus === 'In' ? 'Out' : 'In';

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const newEntry = {
                id: Date.now().toString(),
                date: `${year}-${month}-${day}`,
                time: `${hours}:${minutes}:${seconds}`,
                type: nextType,
                timestamp: now.toISOString()
            };

            logs.push(newEntry);
            saveAndRefresh();
            showNotification(`Successfully recorded clock ${nextType.toLowerCase()} at ${newEntry.time}!`);
        }

        // Save logs to localStorage and refresh UI
        function saveAndRefresh() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
            updateUI();
        }

        // Delete an individual log entry
        function deleteLog(id) {
            logs = logs.filter(item => item.id !== id);
            saveAndRefresh();
            showNotification("Entry deleted successfully.", "success");
        }

        // Clear all logs
        function clearAllData() {
            if (confirm('Are you sure you want to clear all history? This cannot be undone.')) {
                logs = [];
                saveAndRefresh();
                showNotification("All history cleared.", "success");
            }
        }

        // Helper to confirm clear without native confirm() if needed, but standard confirm is fine or fallback to custom modal.
        // Let's override the clearAllData confirmation safely to avoid native confirm if required, or keep clean. Let's make a safe toggle or custom confirm.
        window.clearAllData = function() {
            if (window.confirm("Are you sure you want to clear all work logs?")) {
                logs = [];
                saveAndRefresh();
                showNotification("All records have been cleared.", "error");
            }
        }

        // Export data to CSV
        function exportData() {
            if (logs.length === 0) {
                showNotification("No data available to export.", "error");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Date,Time,Type\n";
            logs.forEach(row => {
                csvContent += `${row.date},${row.time},${row.type}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `work_hours_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showNotification("CSV Export successful!");
        }

        // Calculate ISO Week Number for grouping
        function getISOWeek(dateObj) {
            const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
        }

        // Update the User Interface (Button state, Table, Weekly Summary)
        function updateUI() {
            const currentStatus = getCurrentStatus();
            const badge = document.getElementById('status-badge');
            const btn = document.getElementById('action-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const lastActionText = document.getElementById('last-action-time');

            // Sort logs by timestamp descending for table view
            const sortedLogs = [...logs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            // Update Status Badge & Button Styling
            if (currentStatus === 'In') {
                badge.className = 'mt-1 inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-emerald-100 text-emerald-800';
                badge.innerHTML = '<span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Currently Clocked In';
                
                btn.className = 'w-full sm:w-80 py-5 px-8 rounded-2xl font-bold text-lg text-white shadow-lg transition-all transform active:scale-95 flex items-center justify-center space-x-3 bg-rose-600 hover:bg-rose-700 shadow-rose-200';
                btnText.innerText = 'Clock Out';
                btnIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>';
            } else {
                badge.className = 'mt-1 inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-amber-100 text-amber-800';
                badge.innerHTML = '<span class="w-2 h-2 mr-1.5 rounded-full bg-amber-500"></span> Checked Out';
                
                btn.className = 'w-full sm:w-80 py-5 px-8 rounded-2xl font-bold text-lg text-white shadow-lg transition-all transform active:scale-95 flex items-center justify-center space-x-3 bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200';
                btnText.innerText = 'Clock In';
                btnIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l-4-4m4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>';
            }

            // Update Last Activity Label
            if (sortedLogs.length > 0) {
                lastActionText.innerText = `Last action: Clock ${sortedLogs[0].type} on ${sortedLogs[0].date} at ${sortedLogs[0].time}`;
            } else {
                lastActionText.innerText = 'No recent activity recorded';
            }

            // Populate Table
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';
            if (sortedLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400">No logs found. Tap the button above to start tracking.</td></tr>`;
            } else {
                sortedLogs.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors';
                    const typeBadge = log.type === 'In' 
                        ? '<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-100 text-emerald-800">In</span>' 
                        : '<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-amber-100 text-amber-800">Out</span>';
                    
                    tr.innerHTML = `
                        <td class="py-3 px-4 font-medium text-slate-700">${log.date}</td>
                        <td class="py-3 px-4 text-slate-600 font-mono">${log.time}</td>
                        <td class="py-3 px-4">${typeBadge}</td>
                        <td class="py-3 px-4 text-right">
                            <button onclick="deleteLog('${log.id}')" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg transition-colors" title="Delete entry">
                                <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Calculate and Render Weekly Summary
            renderWeeklySummary();
        }

        // Calculate hours worked per week and render summary cards
        function renderWeeklySummary() {
            const container = document.getElementById('weekly-summary-container');
            if (logs.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">No hours recorded yet. Click Clock In to start!</div>`;
                return;
            }

            // Sort chronological for pair calculations (In -> Out)
            const chronoLogs = [...logs].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            let weeksMap = {}; // { '2026-W16': { totalMs: 0, entriesCount: 0, days: Set } }

            let currentInTime = null;

            chronoLogs.forEach(log => {
                const logDate = new Date(log.timestamp);
                const weekKey = getISOWeek(logDate);

                if (!weeksMap[weekKey]) {
                    weeksMap[weekKey] = { totalMs: 0, days: new Set() };
                }

                weeksMap[weekKey].days.add(log.date);

                if (log.type === 'In') {
                    currentInTime = logDate;
                } else if (log.type === 'Out' && currentInTime) {
                    const diff = logDate - currentInTime;
                    if (diff > 0) {
                        weeksMap[weekKey].totalMs += diff;
                    }
                    currentInTime = null; // reset pair
                }
            });

            // If currently clocked in, we can optionally estimate hours up to now, or just calculate completed intervals. We'll stick to completed intervals + active indication.
            const sortedWeeks = Object.keys(weeksMap).sort().reverse();

            container.innerHTML = '';
            sortedWeeks.forEach(week => {
                const data = weeksMap[week];
                const totalHours = (data.totalMs / (1000 * 60 * 60)).toFixed(2);
                const hoursInt = Math.floor(data.totalMs / (1000 * 60 * 60));
                const minsInt = Math.floor((data.totalMs % (1000 * 60 * 60)) / (1000 * 60));

                const card = document.createElement('div');
                card.className = 'bg-slate-50 border border-slate-100 rounded-xl p-4 flex items-center justify-between';
                card.innerHTML = `
                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">Week ${week}</span>
                        <div class="text-xl font-bold text-slate-800 mt-1">${hoursInt} hrs ${minsInt} mins</div>
                        <div class="text-xs text-slate-400 mt-0.5">${data.days.size} active day(s) recorded</div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-mono bg-white border border-slate-200 px-2.5 py-1 rounded-lg text-slate-600">${totalHours}h decimal</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Initial UI render on load
        updateUI();
    </script>
</body>
</html>
