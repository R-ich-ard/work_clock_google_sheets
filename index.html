<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Clock Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 border border-slate-100">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Work Clock</h1>
            <p class="text-sm text-slate-500">Tap to log your shift</p>
        </header>

        <!-- Configuration for Google Sheet Web App URL -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Google Apps Script Web App URL</label>
            <input type="text" id="scriptUrl" placeholder="Paste your Web App URL here..." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Big Action Button -->
        <div class="mb-8">
            <button id="clockBtn" onclick="toggleClock()" class="w-full py-5 text-xl font-bold rounded-xl shadow-md transition transform active:scale-95 bg-indigo-600 hover:bg-indigo-700 text-white">
                Clock In
            </button>
            <p id="statusText" class="text-center text-xs text-slate-400 mt-2">Currently: Clocked Out</p>
        </div>

        <!-- Weekly Summary -->
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-6 flex justify-between items-center">
            <div>
                <span class="text-xs font-medium text-slate-500 uppercase tracking-wider block">This Week's Hours</span>
                <span id="weeklyHours" class="text-2xl font-extrabold text-slate-900">0.00 hrs</span>
            </div>
            <button onclick="exportCSV()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg transition">
                Export CSV
            </button>
        </div>

        <!-- History Log -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Recent Logs</h2>
                <button onclick="clearLogs()" class="text-xs text-rose-500 hover:underline">Clear History</button>
            </div>
            <div id="logContainer" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Log items populated via JS -->
            </div>
        </div>
    </div>

    <script>
        let logs = JSON.parse(localStorage.getItem('work_logs')) || [];
        let isClockedIn = localStorage.getItem('is_clocked_in') === 'true';

        // Load saved script URL if present
        const savedUrl = localStorage.getItem('script_url');
        if (savedUrl) {
            document.getElementById('scriptUrl').value = savedUrl;
        }

        document.getElementById('scriptUrl').addEventListener('input', (e) => {
            localStorage.setItem('script_url', e.target.value.trim());
        });

        function updateUI() {
            const btn = document.getElementById('clockBtn');
            const statusText = document.getElementById('statusText');

            if (isClockedIn) {
                btn.textContent = 'Clock Out';
                btn.className = 'w-full py-5 text-xl font-bold rounded-xl shadow-md transition transform active:scale-95 bg-rose-600 hover:bg-rose-700 text-white';
                statusText.textContent = 'Currently: Clocked In';
            } else {
                btn.textContent = 'Clock In';
                btn.className = 'w-full py-5 text-xl font-bold rounded-xl shadow-md transition transform active:scale-95 bg-indigo-600 hover:bg-indigo-700 text-white';
                statusText.textContent = 'Currently: Clocked Out';
            }

            renderLogs();
            calculateWeeklyHours();
        }

        function toggleClock() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);
            const action = isClockedIn ? 'Out' : 'In';

            isClockedIn = !isClockedIn;
            localStorage.setItem('is_clocked_in', isClockedIn);

            const newLog = { date: dateStr, time: timeStr, action: action, timestamp: now.getTime() };
            logs.unshift(newLog);
            localStorage.setItem('work_logs', JSON.stringify(logs));

            // Send to Google Sheet in background
            sendToGoogleSheet(dateStr, timeStr, action);

            updateUI();
        }

        function sendToGoogleSheet(date, time, action) {
            const url = document.getElementById('scriptUrl').value.trim();
            if (!url) return; // Skip if no URL provided yet

            fetch(url, {
                method: 'POST',
                mode: 'no-cors', // Required for Google Apps Script web apps
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date: date, time: time, action: action })
            }).catch(err => console.error('Sheet sync error:', err));
        }

        function renderLogs() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '';

            if (logs.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No logs recorded yet.</p>';
                return;
            }

            logs.forEach((log, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 border border-slate-100 p-3 rounded-xl text-xs';
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full ${log.action === 'In' ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                        <span class="font-semibold text-slate-700">${log.date}</span>
                        <span class="text-slate-500">${log.time}</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="font-bold ${log.action === 'In' ? 'text-emerald-600' : 'text-rose-600'}">Clock ${log.action}</span>
                        <button onclick="deleteLog(${index})" class="text-slate-300 hover:text-rose-500">&times;</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deleteLog(index) {
            logs.splice(index, 1);
            localStorage.setItem('work_logs', JSON.stringify(logs));
            updateUI();
        }

        function clearLogs() {
            if (confirm('Are you sure you want to clear your local logs?')) {
                logs = [];
                isClockedIn = false;
                localStorage.removeItem('work_logs');
                localStorage.setItem('is_clocked_in', 'false');
                updateUI();
            }
        }

        function calculateWeeklyHours() {
            // Sort chronologically for calculation
            const sorted = [...logs].sort((a, b) => a.timestamp - b.timestamp);
            let totalMinutes = 0;
            let lastInTime = null;

            sorted.forEach(log => {
                const logTime = new Date(`${log.date}T${log.time}:00`).getTime();
                if (log.action === 'In') {
                    lastInTime = logTime;
                } else if (log.action === 'Out' && lastInTime !== null) {
                    totalMinutes += (logTime - lastInTime) / (1000 * 60);
                    lastInTime = null;
                }
            });

            const hours = (totalMinutes / 60).toFixed(2);
            document.getElementById('weeklyHours').textContent = `${hours} hrs`;
        }

        function exportCSV() {
            let csv = 'Date,Time,Action\n';
            logs.forEach(l => {
                csv += `${l.date},${l.time},${l.action}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'work_clock_logs.csv');
            a.click();
        }

        updateUI();
    </script>
</body>
</html>
